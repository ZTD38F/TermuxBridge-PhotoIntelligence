name: Release
on:
  push:
    branches: [stable]
permissions:
  contents: write
# An immutable version can be published once. Never allow concurrent uploads.
concurrency:
  group: photo-intelligence-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("addon.json"))["version"])')"
          TAG="v$VERSION"
          python - "$VERSION" <<'PY_VERSION'
          import re,sys
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",sys.argv[1]):
              raise SystemExit("Invalid release version")
          PY_VERSION
          # Fail closed if the existing tag or lookup cannot be verified.
          existing_tag="$(git ls-remote --tags --refs origin "refs/tags/$TAG")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Release $TAG is immutable; bump addon.json before publishing."
            exit 1
          fi
          mkdir -p dist/package
          rsync -a --exclude .git --exclude dist ./ dist/package/
          tar -C dist/package -czf "dist/TermuxBridge-PhotoIntelligence-$TAG.tar.gz" .
          (cd dist && sha256sum "TermuxBridge-PhotoIntelligence-$TAG.tar.gz" > SHA256SUMS.txt)
          python - <<PY
          import json
          from pathlib import Path
          d=json.loads(Path('addon.json').read_text())
          Path('dist/addon-release.json').write_text(json.dumps({'name':d['name'],'version':d['version'],'abi':d['abi'],'bridge_min_version':d['bridge_min_version'],'commit':'${{ github.sha }}'},indent=2)+'\n')
          PY
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-check at publication time, preventing stale build races.
          existing_tag="$(git ls-remote --tags --refs origin "refs/tags/$TAG")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag $TAG already exists; refusing to overwrite artifacts."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite artifacts."
            exit 1
          fi
          # Always tag the exact stable commit, never the default branch.
          gh release create "$TAG" dist/addon-release.json dist/SHA256SUMS.txt dist/TermuxBridge-PhotoIntelligence-"$TAG".tar.gz --target "$GITHUB_SHA" --title "$TAG" --generate-notes
