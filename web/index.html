<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Intelligence</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0b0d10;color:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:#0b0d10}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:750}.muted{color:#8d97a5}.live{font-size:12px;padding:6px 9px;border:1px solid #2d7a4c;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#12161c;border:1px solid #252b34;border-radius:16px;padding:16px}.big{font-size:28px;font-weight:750}.progress{height:10px;background:#222832;border-radius:999px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,#777ef8,#b084ff);width:0}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{border:1px solid #303744;background:#151a21;color:#dfe5ec;border-radius:12px;padding:9px 12px}.tab.active{background:#252b35}.panel{display:none}.panel.active{display:block}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid #303744;background:#0e1217;color:white;border-radius:12px;padding:12px}.search button{border:0;border-radius:12px;padding:0 18px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}.tile{background:#12161c;border:1px solid #252b34;border-radius:12px;overflow:hidden}.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#090b0e}.meta{padding:8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #242a33}.badge{font-size:12px;border:1px solid #343c48;border-radius:999px;padding:4px 7px}.warn{border-color:#7d6230}.good{border-color:#2d7a4c}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">Photo Intelligence</div><div class="muted">TermuxBridge addon · @dvkrum</div></div><div id="live" class="live">CONNECTING</div></div>
<div class="grid">
<div class="card"><div class="muted">Library</div><div id="library" class="big">—</div><div class="muted" id="sources">—</div></div>
<div class="card"><div class="muted">OCR</div><div id="ocrpct" class="big">—</div><div class="progress"><div id="ocrbar" class="bar"></div></div><div class="muted" id="ocrdetail">—</div></div>
<div class="card"><div class="muted">Visual index</div><div id="visualpct" class="big">—</div><div class="progress"><div id="visualbar" class="bar"></div></div><div class="muted" id="visualdetail">—</div></div>
<div class="card"><div class="muted">Semantic index</div><div id="semanticpct" class="big">—</div><div class="progress"><div id="semanticbar" class="bar"></div></div><div class="muted" id="semanticdetail">—</div></div>
<div class="card"><div class="muted">Health</div><div id="db" class="big">—</div><div class="muted" id="storage">—</div></div>
</div>
<div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="search">Search</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="categories">Categories</button><button class="tab" data-tab="duplicates">Duplicates</button><button class="tab" data-tab="cleanup">Cleanup</button></div>
<section id="overview" class="panel active"><div class="card"><div class="rows" id="overviewRows"></div></div></section>
<section id="search" class="panel"><div class="card"><div class="search"><input id="q" placeholder="Search filename, folder, or OCR text"><button id="searchBtn">Search</button></div><div id="searchResults" class="gallery"></div></div></section>
<section id="gallery" class="panel"><div class="card"><div id="galleryResults" class="gallery"></div></div></section>
<section id="categories" class="panel"><div class="card"><div id="categoryRows" class="rows"></div></div></section>
<section id="duplicates" class="panel"><div class="card"><div id="duplicateRows" class="rows"></div></div></section>
<section id="cleanup" class="panel"><div class="card"><div class="muted">Recommendations only. Nothing is removed automatically.</div><div id="cleanupRows" class="rows"></div></div></section>
</div>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pct(v){return (Number(v||0)).toFixed(2)+'%'}
function tile(x){return `<div class="tile"><img loading="lazy" src="/api/thumb?id=${x.id}"><div class="meta">#${x.id} ${esc(x.name)}</div><div class="meta muted">${esc(x.album)}</div></div>`}
async function api(p){const r=await fetch(p,{cache:'no-store'});return await r.json()}
async function refresh(){try{const s=await api('/api/status'); $('#live').textContent='● LIVE'; $('#live').className='live good'; $('#library').textContent=(s.library.total||0).toLocaleString(); $('#sources').textContent=`Android/data: ${(s.library.shizuku||0).toLocaleString()}`; const op=s.full.percent??(s.ocr.ocr_indexed+s.ocr.ocr_failed)*100/Math.max(1,s.library.total); $('#ocrpct').textContent=pct(op); $('#ocrbar').style.width=Math.min(100,op)+'%'; $('#ocrdetail').textContent=`${s.full.processed||0} processed · ${s.full.remaining??'—'} remaining`; const vp=s.visual.percent||0; $('#visualpct').textContent=pct(vp); $('#visualbar').style.width=Math.min(100,vp)+'%'; $('#visualdetail').textContent=`${s.visual.indexed||0} / ${s.visual.total||0}`; const sp=s.semantic.percent||0; $('#semanticpct').textContent=s.semantic.available?pct(sp):'MODEL'; $('#semanticbar').style.width=Math.min(100,sp)+'%'; $('#semanticdetail').textContent=s.semantic.available?`${s.semantic.indexed||0} / ${s.semantic.total||0}`:'not installed'; $('#db').textContent=(s.db_integrity||'unknown').toUpperCase(); $('#storage').textContent=`${s.free_storage_gib??'—'} GiB free`; $('#overviewRows').innerHTML=[['Full OCR',s.full.state||'—'],['Recognized',s.full.recognized||0],['OCR failures',s.full.failed||0],['Shizuku sources',s.library.shizuku||0],['Semantic backend',s.semantic.available?'CLIP ONNX':'not installed']].map(([a,b])=>`<div class="row"><span>${esc(a)}</span><span class="badge">${esc(b)}</span></div>`).join('')}catch(e){$('#live').textContent='OFFLINE';$('#live').className='live warn'}}
async function loadGallery(){const x=await api('/api/gallery?limit=60');$('#galleryResults').innerHTML=(x.items||[]).map(tile).join('')}
async function search(){const q=encodeURIComponent($('#q').value.trim());const x=await api('/api/search?q='+q+'&limit=100');$('#searchResults').innerHTML=(x.items||[]).map(tile).join('')||'<div class="muted">No results</div>'}
async function categories(){const x=await api('/api/categories');$('#categoryRows').innerHTML=(x.categories||[]).map(c=>`<div class="row"><span>${esc(c.name)}</span><span class="badge">${c.count}</span></div>`).join('')}
async function cleanup(){const x=await api('/api/cleanup');$('#cleanupRows').innerHTML=(x.items||[]).map(c=>`<div class="row"><span>#${c.id} ${esc(c.name)}<br><span class="muted">${esc(c.reasons.join(', '))}</span></span><span class="badge">${Math.round(c.confidence*100)}%</span></div>`).join('')||'<div class="muted">No strong candidates yet. Visual indexing may still be running.</div>'}
async function duplicates(){const x=await api('/api/duplicates');const exact=(x.exact?.groups||[]).map(g=>`<div class="row"><span>Exact duplicates · ${g.ids.length} files<br><span class="muted">IDs ${g.ids.join(', ')}</span></span><span class="badge">${(g.reclaimable_bytes/1048576).toFixed(1)} MB</span></div>`);const near=(x.near?.groups||[]).slice(0,30).map(g=>`<div class="row"><span>Near duplicates · ${g.count} files<br><span class="muted">IDs ${g.ids.join(', ')}</span></span><span class="badge warn">review</span></div>`);$('#duplicateRows').innerHTML=[...exact,...near].join('')||'<div class="muted">No duplicate groups indexed yet.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='gallery')await loadGallery();if(b.dataset.tab==='categories')await categories();if(b.dataset.tab==='duplicates')await duplicates();if(b.dataset.tab==='cleanup')await cleanup()});$('#searchBtn').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});refresh();setInterval(refresh,5000);
</script></body></html>
