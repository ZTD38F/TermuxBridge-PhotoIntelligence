<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Photo Intelligence</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#0a0c10;--panel:#12161d;--panel2:#171c24;--line:#28303b;--muted:#8f9aa8;--text:#f3f6fa;--accent:#9297ff;--good:#55c78a;--warn:#e4b55f;--bad:#e77474}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:1280px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{font-weight:800;font-size:23px;letter-spacing:-.02em}.sub{color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px}.good{border-color:#2e7751;color:#78d9a3}.warn{border-color:#806638;color:#e8c779}.bad{border-color:#824343;color:#ef9292}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.metric{font-size:27px;font-weight:780;margin-top:4px}.label{color:var(--muted);font-size:12px}.progress{height:8px;background:#252c36;border-radius:99px;overflow:hidden;margin:9px 0 6px}.bar{height:100%;background:linear-gradient(90deg,#777df2,#ad83ff);transition:width .4s}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:9px 12px;white-space:nowrap}.tab.active,.btn:hover{background:var(--panel2)}.panel{display:none}.panel.active{display:block}.sources,.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.source,.stage{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #242b35;align-items:center}.row:last-child{border-bottom:0}.search{display:flex;gap:8px}.search input,.select{background:#0e1218;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}.search input{flex:1}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px;margin-top:12px}.tile{background:var(--panel2);border:1px solid var(--line);border-radius:11px;overflow:hidden}.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#07090c}.meta{padding:6px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted)}.settings{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:12px}.setting{display:grid;gap:7px;margin-bottom:14px}.check{display:flex;gap:8px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px}.notice{margin-top:10px;padding:10px;border-radius:10px;background:#171c24;color:var(--muted)}@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.settings{grid-template-columns:1fr}.wrap{padding:11px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="brand">Photo Intelligence</div><div class="sub">TermuxBridge addon · @dvkrum</div></div><span id="live" class="pill">CONNECTING</span></div>
<div class="grid">
<div class="card"><div class="label">Library</div><div id="library" class="metric">—</div><div id="albums" class="small muted">—</div></div>
<div class="card"><div class="label">OCR</div><div id="ocrpct" class="metric">—</div><div class="progress"><div id="ocrbar" class="bar"></div></div><div id="ocrdetail" class="small muted">—</div></div>
<div class="card"><div class="label">Visual</div><div id="visualpct" class="metric">—</div><div class="progress"><div id="visualbar" class="bar"></div></div><div id="visualdetail" class="small muted">—</div></div>
<div class="card"><div class="label">Semantic</div><div id="semanticpct" class="metric">—</div><div class="progress"><div id="semanticbar" class="bar"></div></div><div id="semanticdetail" class="small muted">—</div></div>
<div class="card"><div class="label">Health</div><div id="health" class="metric">—</div><div id="storage" class="small muted">—</div></div>
</div>
<div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="search">Search</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="duplicates">Duplicates</button><button class="tab" data-tab="cleanup">Cleanup</button><button class="tab" data-tab="settings">Settings</button></div>
<section id="overview" class="panel active"><div class="card"><div class="label">Sources</div><div id="sourceCards" class="sources" style="margin-top:10px"></div></div><div class="card" style="margin-top:10px"><div class="label">Pipeline</div><div id="stageCards" class="stages" style="margin-top:10px"></div></div><div class="card" style="margin-top:10px"><div id="overviewRows"></div></div></section>
<section id="search" class="panel"><div class="card"><div class="search"><input id="q" placeholder="Search filename, OCR text, or visual meaning"><button id="searchBtn" class="btn">Search</button></div><div id="searchResults" class="gallery"></div></div></section>
<section id="gallery" class="panel"><div class="card"><div id="galleryResults" class="gallery"></div></div></section>
<section id="duplicates" class="panel"><div class="card"><div id="duplicateRows"></div></div></section>
<section id="cleanup" class="panel"><div class="card"><div class="small muted">Recommendations only. Source files are not deleted automatically.</div><div id="cleanupRows"></div></div></section>
<section id="settings" class="panel"><div class="settings"><div class="card"><div class="setting"><label class="label">Processing profile</label><select id="profile" class="select"><option value="balanced">Balanced</option><option value="fast">Fast</option><option value="unlimited">Unlimited</option></select></div><div class="setting"><label class="check"><input id="autoOcr" type="checkbox"> OCR</label><label class="check"><input id="autoVisual" type="checkbox"> Visual features</label><label class="check"><input id="autoSemantic" type="checkbox"> Semantic embeddings</label><label class="check"><input id="autoDuplicates" type="checkbox"> Duplicate hashing</label><label class="check"><input id="watchLocal" type="checkbox"> Near-real-time local watcher</label></div><div class="actions"><button id="saveSettings" class="btn">Save</button><button id="reconcile" class="btn">Reconcile now</button></div><div id="settingsMsg" class="notice">—</div></div><div class="card"><div class="label">Effective limits</div><div id="effectiveRows"></div></div></div></section>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=v=>(Number(v||0)).toFixed(2)+'%';
async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',...opt});const j=await r.json();if(!r.ok||j.ok===false&&r.status>=400)throw new Error(j.error||r.statusText);return j}
const row=(a,b)=>`<div class="row"><span>${esc(a)}</span><span class="pill">${esc(b)}</span></div>`;
function tile(x){return `<div class="tile"><img loading="lazy" src="/api/thumb?id=${x.id}"><div class="meta">#${x.id} ${esc(x.name)}</div><div class="meta muted">${esc(x.album)}</div>${x.match?.length?`<div class="meta">${esc(x.match.join(' + '))}</div>`:''}${x.semantic_score!=null?`<div class="meta">semantic ${Number(x.semantic_score).toFixed(3)}</div>`:''}</div>`}
function sourceCard(name,s){const state=s.state||((s.available===false)?'DEFERRED':'READY');return `<div class="source"><div>${esc(name)}</div><div class="metric" style="font-size:18px">${Number(s.indexed||0).toLocaleString()}</div><span class="pill ${state==='READY'?'good':'warn'}">${esc(state)}</span></div>`}
function stageCard(name,s){const p=Number(s?.percent||0),rem=Number(s?.remaining||0);return `<div class="stage"><div>${esc(name)}</div><div class="metric" style="font-size:18px">${pct(p)}</div><div class="progress"><div class="bar" style="width:${Math.min(100,p)}%"></div></div><div class="small muted">${rem.toLocaleString()} remaining</div></div>`}
async function refresh(){try{const s=await api('/api/status');$('#live').textContent='● LIVE';$('#live').className='pill good';$('#library').textContent=Number(s.library.total||0).toLocaleString();$('#albums').textContent=`${s.library.albums||0} albums`;
const op=(Number(s.ocr.ocr_indexed||0)+Number(s.ocr.ocr_failed||0))*100/Math.max(1,s.library.total);$('#ocrpct').textContent=pct(op);$('#ocrbar').style.width=Math.min(100,op)+'%';$('#ocrdetail').textContent=`${(s.ocr.ocr_indexed||0).toLocaleString()} recognized · ${(s.ocr.ocr_failed||0).toLocaleString()} failed`;
const vp=s.visual.percent||0;$('#visualpct').textContent=pct(vp);$('#visualbar').style.width=Math.min(100,vp)+'%';$('#visualdetail').textContent=`${(s.visual.indexed||0).toLocaleString()} indexed`;
const sp=s.semantic.percent||0;$('#semanticpct').textContent=s.semantic.available?pct(sp):'MODEL';$('#semanticbar').style.width=Math.min(100,sp)+'%';$('#semanticdetail').textContent=s.semantic.available?`${(s.semantic.indexed||0).toLocaleString()} indexed`:'model unavailable';
const hs=s.health.state||'UNKNOWN';$('#health').textContent=hs;$('#storage').textContent=`${s.free_storage_gib??'—'} GiB free · DB ${s.db_integrity||'?'}`;
const sources=s.sources.sources||{};$('#sourceCards').innerHTML=Object.entries(sources).map(([k,v])=>sourceCard(k.replaceAll('_',' '),v)).join('');$('#stageCards').innerHTML=[stageCard('OCR',{percent:op,remaining:Math.max(0,s.library.total-(s.ocr.ocr_indexed||0)-(s.ocr.ocr_failed||0))}),stageCard('Visual',s.visual),stageCard('Semantic',s.semantic),stageCard('Duplicates',{percent:s.duplicates.percent||0,remaining:s.duplicates.remaining||0})].join('');
const pipe=s.pipeline.pipeline||{};const watch=s.pipeline.watcher||{};$('#overviewRows').innerHTML=[['Pipeline',pipe.state||'NOT_STARTED'],['Profile',pipe.profile||s.settings.settings?.profile||'—'],['Watcher',watch.mode||watch.state||'NOT_STARTED'],['Cycle',pipe.cycle_seconds!=null?pipe.cycle_seconds+' s':'—'],['Deferred sources',(s.sources.deferred_sources||[]).join(', ')||'none'],['Battery',pipe.battery?.available?`${pipe.battery.level}% · ${pipe.battery.temperature_c}°C`:'—']].map(x=>row(...x)).join('');fillSettings(s.settings)}catch(e){$('#live').textContent='OFFLINE';$('#live').className='pill bad'}}
function fillSettings(s){if(!s?.settings)return;const v=s.settings;$('#profile').value=v.profile||'balanced';$('#autoOcr').checked=!!v.auto_ocr;$('#autoVisual').checked=!!v.auto_visual;$('#autoSemantic').checked=!!v.auto_semantic;$('#autoDuplicates').checked=!!v.auto_duplicates;$('#watchLocal').checked=!!v.watch_local;const e=s.effective||{};$('#effectiveRows').innerHTML=[['Scan interval',(e.scan_interval||0)+' s'],['OCR batch',e.ocr_images||'—'],['Visual batch',e.visual_images||'—'],['Semantic batch',e.semantic_images||'—'],['Minimum battery',(e.min_battery||0)+'%'],['Thermal pause',(e.thermal_pause_c||0)+'°C']].map(x=>row(...x)).join('')}
async function loadGallery(){const x=await api('/api/gallery?limit=80');$('#galleryResults').innerHTML=(x.items||[]).map(tile).join('')}
async function search(){const q=encodeURIComponent($('#q').value.trim());if(!q)return;const x=await api('/api/search?q='+q+'&limit=100');$('#searchResults').innerHTML=(x.items||[]).map(tile).join('')||'<div class="notice">No results</div>'}
async function duplicates(){const x=await api('/api/duplicates');const exact=(x.exact?.groups||[]).map(g=>row(`Exact · IDs ${g.ids.join(', ')}`,`${(g.reclaimable_bytes/1048576).toFixed(1)} MB`));const near=(x.near?.groups||[]).slice(0,40).map(g=>row(`Near · IDs ${g.ids.join(', ')}`,'review'));$('#duplicateRows').innerHTML=[...exact,...near].join('')||'<div class="notice">No duplicate groups indexed yet.</div>'}
async function cleanup(){const x=await api('/api/cleanup');$('#cleanupRows').innerHTML=(x.items||[]).map(c=>row(`#${c.id} ${c.name} · ${c.reasons.join(', ')}`,Math.round(c.confidence*100)+'%')).join('')||'<div class="notice">No strong cleanup candidates.</div>'}
async function saveSettings(){try{const body={profile:$('#profile').value,auto_ocr:$('#autoOcr').checked,auto_visual:$('#autoVisual').checked,auto_semantic:$('#autoSemantic').checked,auto_duplicates:$('#autoDuplicates').checked,watch_local:$('#watchLocal').checked};await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('#settingsMsg').textContent='Saved. Scheduler will pick up changes automatically.';await refresh()}catch(e){$('#settingsMsg').textContent='Error: '+e.message}}
async function reconcile(){try{await api('/api/reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'dashboard'})});$('#settingsMsg').textContent='Reconciliation queued.'}catch(e){$('#settingsMsg').textContent='Error: '+e.message}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='gallery')await loadGallery();if(b.dataset.tab==='duplicates')await duplicates();if(b.dataset.tab==='cleanup')await cleanup()});$('#searchBtn').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('#saveSettings').onclick=saveSettings;$('#reconcile').onclick=reconcile;refresh();setInterval(refresh,5000);
</script></body></html>
